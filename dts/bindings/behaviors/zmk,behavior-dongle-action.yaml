description: Dongle Action Behavior

compatible: "zmk,behavior-dongle-action"

properties:
  label:
    type: string
    required: true
  action:
    type: string
    required: true
    enum:
      - "pacman-up"
      - "pacman-down"
      - "pacman-left"
      - "pacman-right"
      - "pacman-start"
      - "pacman-pause"
      - "pacman-quit"
