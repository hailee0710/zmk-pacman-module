# Pacman Dongle Adapter Configuration

# ZMK display subsystem
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Display hardware
CONFIG_DISPLAY=y
CONFIG_LVGL=y

# LVGL color depth (16-bit RGB565)
CONFIG_LV_COLOR_DEPTH_16=y

# Peripherals
CONFIG_SPI=y
CONFIG_GPIO=y

# Pacman module
CONFIG_ZMK_DONGLE_PACMAN=y
CONFIG_ZMK_DONGLE_ACTION=y

# Log level (info)
CONFIG_DISPLAY_LOG_LEVEL_INF=y

# LVGL tuning
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y
