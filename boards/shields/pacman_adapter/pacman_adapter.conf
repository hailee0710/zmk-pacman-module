# Pacman Dongle Adapter Configuration

# Enable display - landscape 320x172
CONFIG_DISPLAY=y
CONFIG_LVGL=y

# Display resolution - ST7789P3 landscape
CONFIG_LVGL_HOR_RES=320
CONFIG_LVGL_VER_RES=172
CONFIG_LVGL_COLOR_DEPTH=16

# Enable peripherals
CONFIG_SPI=y
CONFIG_GPIO=y

# Enable Pacman module
CONFIG_ZMK_DONGLE_PACMAN=y
CONFIG_ZMK_DONGLE_ACTION=y

# Display log level
CONFIG_DISPLAY_LOG_LEVEL=3

# LVGL settings
CONFIG_LVGL_USE_DISP=y
CONFIG_LVGL_BUF_ALLOC_DYNAMIC=y
CONFIG_LVGL_DPI_DEF=195
CONFIG_LVGL_DRAW_BUF_ALIGN=4
CONFIG_LVGL_DEF_REFR_PERIOD=33
CONFIG_LVGL_INDEV_DEF_LONG_PRESS_TIME=400
CONFIG_LVGL_INDEV_DEF_LONG_PRESS_REP_TIME=100
