# Pacman Dongle Adapter Configuration

# ZMK display subsystem
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Display hardware
CONFIG_DISPLAY=y
CONFIG_LVGL=y

# LVGL color depth (16-bit RGB565)
CONFIG_LV_COLOR_DEPTH_16=y

# Hand LVGL's RGB565 buffer to the display driver already in
# big-endian-on-wire byte order, so the driver can bulk spi_write_dt()
# it as-is without a per-pixel byte swap.
CONFIG_LV_COLOR_16_SWAP=y

# Peripherals
CONFIG_SPI=y
CONFIG_GPIO=y

# P0.09 (display CS) is an NFC-antenna pin on nRF52840; without this it
# isn't usable as a plain GPIO.
CONFIG_NFCT_PINS_AS_GPIOS=y

# Pacman module
CONFIG_ZMK_DONGLE_PACMAN=y

# Log level (info)
CONFIG_DISPLAY_LOG_LEVEL_INF=y

# LVGL tuning
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y
# 320x172 RGB565 VDB at 10% needs ~11KB; default 2048 causes -ENOMEM and
# no display gets registered.
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_USE_IMG=y
