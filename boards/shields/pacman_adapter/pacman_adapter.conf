# Pacman Dongle Adapter Configuration

# ZMK display subsystem
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Display hardware
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LVGL_HOR_RES=320
CONFIG_LVGL_VER_RES=172
CONFIG_LVGL_COLOR_DEPTH=16

# Peripherals
CONFIG_SPI=y
CONFIG_GPIO=y

# Pacman module
CONFIG_ZMK_DONGLE_PACMAN=y
CONFIG_ZMK_DONGLE_ACTION=y

# Log level (3=info)
CONFIG_DISPLAY_LOG_LEVEL=3

# LVGL tuning
CONFIG_LVGL_USE_DISP=y
CONFIG_LVGL_BUF_ALLOC_DYNAMIC=y
CONFIG_LVGL_DEF_REFR_PERIOD=33
